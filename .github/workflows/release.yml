name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  wheel_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend
        working-directory: web_admin
        run: |
          npm install
          npm run build

      - name: Build wheel and checksums
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
          cd dist
          sha256sum *.whl > SHA256SUMS

      - name: Attach wheel assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/SHA256SUMS
          generate_release_notes: true

  docker_release:
    needs: wheel_release
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          TAG="${GITHUB_REF_NAME}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file docker/Dockerfile \
            --tag ${IMAGE_NAME}:${TAG} \
            --tag ${IMAGE_NAME}:latest \
            --push \
            .

      - name: Update GitHub release deployment notes
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Deployment

            ```bash
            cd xray-audit/docker
            docker compose pull
            docker compose up -d
            ```

            ## Notes
            - Run required SQL migrations before upgrading.
            - Pin production to a version tag instead of `latest`.
            - The wheel and `SHA256SUMS` are attached release assets.
